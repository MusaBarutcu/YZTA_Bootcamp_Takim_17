services:
  - type: web
    name: carbon-app
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python seed_demo_data.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: CARBON_DAILY_BUDGET_KG
        value: "15.0"
